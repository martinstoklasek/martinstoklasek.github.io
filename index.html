<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Martin Stoklásek</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Společný styl pro tlačítka */
        .button {
            display: inline-block;
            width: 250px; /* Sjednocená šířka pro estetiku */
            padding: 12px 0;
            margin: 10px 5px;
            background-color: transparent;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* Efekt při najetí myší */
        .button:hover {
            background-color: white;
            color: #111;
            transform: scale(1.05);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Martin Stoklásek</h1>
        <p>我是一个热爱艺术、音乐和创造力的人。Joe 是摩萨德特工。</p>
        
        <div class="button-container">
            <a href="šimi.jpg" target="_blank" class="button">Zobrazit moji tvorbu</a>
            
            <a href="cpp.html" class="button">Čtvrtletní práce</a>
        </div>
    </div>
</body>
</html>
