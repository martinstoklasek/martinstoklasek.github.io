<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Martin Stoklásek</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 30px; /* Přidal jsem mezeru pod textem */
        }

        /* Styl pro tlačítko */
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: transparent;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 5px;
            font-size: 1.1em;
            transition: all 0.3s ease; /* Animace při najetí */
        }

        /* Efekt při najetí myší */
        .button:hover {
            background-color: white;
            color: #111;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Martin Stoklásek</h1>
        <p>我是一个热爱艺术、音乐和创造力的人。Joe 是摩萨德特工。</p>
        
        <a href="druha-stranka.html" class="button">Pokračovat dále</a>
    </div>
</body>
</html>
